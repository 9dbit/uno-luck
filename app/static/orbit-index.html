  <title>UNO LUCK | Dragon Spin v1.1</title>
</head>
<body>
  <div class="boot-overlay" id="boot-overlay" aria-label="Memulai permainan">
    <section class="boot-stage boot-softtech" id="boot-softtech" aria-label="Soft Tech">
      <img class="boot-softtech-logo" id="boot-softtech-img" src="/assets/boot-softtech.webp" alt="Soft Tech" fetchpriority="high">
    </section>
    <section class="boot-stage boot-banner" id="boot-banner" aria-label="Memuat UNO LUCK" hidden>
      <img id="boot-banner-img" class="boot-banner-img" src="/assets/boot-uno-banner.webp" alt="UNO LUCK" decoding="async">
      <div class="boot-banner-vignette" aria-hidden="true"></div>
      <div class="boot-loading-panel" id="boot-loading-panel">
        <div class="boot-loading-track" id="boot-loading-track" role="progressbar" aria-label="Loading game system" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="boot-loading-fill" class="boot-loading-fill"></div>
          <span class="boot-loading-label" id="boot-loading-label">loading game system</span>
        </div>
        <strong id="boot-loading-percent" class="boot-loading-percent">0%</strong>
      </div>
    </section>
  </div>
  <main class="game-shell is-booting" id="game-shell" aria-hidden="true">
    <header class="game-header">
      <img class="uno-logo" src="/assets/art/v1/logo.webp" alt="UNO LUCK">
      <button class="balance-chip" id="wallet-open" type="button" aria-label="Saldo koin virtual">
        <span class="coin" aria-hidden="true">✦</span>
        <span class="balance-readout"><small>KOIN VIRTUAL</small><strong id="wallet-balance">1.000</strong></span>
        <span class="chip-plus" aria-hidden="true">+</span>
      </button>
      <button class="round-hud-btn" id="gift-btn" type="button" aria-label="Klaim hadiah harian"><span aria-hidden="true">🎁</span></button>
      <button class="avatar-btn" id="profile-btn" type="button" aria-label="Profil pemain"><img src="/assets/art/v1/avatar.webp" alt=""></button>
      <button class="round-hud-btn menu" id="menu-open" type="button" aria-label="Menu"><span aria-hidden="true">☰</span></button>
    </header>
    <section class="title-area" aria-label="Mode permainan">
      <h1 class="motion-title">DRAGON SPIN</h1>
      <img id="color-match-burst" class="color-match-burst" src="/assets/art/v4/color-match.webp" alt="" aria-hidden="true" hidden>
      <span id="match-live" class="match-sr-only" role="status" aria-live="assertive"></span>
      <p>3 kartu sewarna <span>•</span> <strong>bonus 2×–200×</strong></p>
    </section>
    <section class="result-area" aria-label="Tiga kartu hasil SPIN">
      <div class="result-frame" id="result-frame">
        <div class="result-point" aria-hidden="true">◆</div>
        <div class="result-cards">
          <div class="result-cell" id="result-0" data-pos="0" aria-label="Kartu kiri"></div>
          <div class="result-cell" id="result-1" data-pos="1" aria-label="Kartu tengah"></div>
          <div class="result-cell" id="result-2" data-pos="2" aria-label="Kartu kanan"></div>
        </div>
      </div>

    </section>
    <div class="result-bar" aria-live="polite">
        <div><small>BET</small><strong id="last-stake">25</strong></div>
        <div><small>PAYOUT</small><strong id="last-payout">—</strong></div>
        <div><small>WIN</small><strong id="last-delta">—</strong></div>
      </div>
    <section class="wheel-area" aria-label="Setengah lingkaran sembilan placeholder kartu LED">
      <div class="wheel-stage">
      <img class="dragon-wheel-art wheel-static-v09" src="/assets/art/v2/wheel-dragon.webp" alt="" aria-hidden="true" decoding="async">
      <div class="ring-halo" aria-hidden="true"></div>
      <div id="orbit-ring" class="wheel-led-ring" aria-label="Sembilan display LED kartu tetap, konten berpindah dari kiri ke kanan"></div>
      <div class="pick-point" id="pick-point" aria-hidden="true">▼</div>
      <div class="action-row">
        <button class="side-action" id="turbo-btn" type="button" aria-label="Turbo" aria-pressed="false"><span class="action-icon">ϟ</span><small>TURBO</small></button>
        <button id="spin-btn" class="spin-candy" type="button" aria-label="Spin kartu berikutnya" disabled>
          <span class="spin-top">SPIN</span><small id="spin-step">1 / 3</small>
        </button>
        <button class="side-action" id="auto-btn" type="button" aria-label="Auto tiga spin per ronde" aria-pressed="false"><span class="action-icon">↻</span><small id="auto-label">AUTO</small></button>
      </div>
      </div>
      <div class="spin-caption" id="spin-caption" role="status" aria-live="polite">SPIN pertama mengisi kartu kiri</div>
      <div id="win-particles" class="win-particles" aria-hidden="true"></div>
    </section>
    <footer class="game-footer">

      <div class="steps" id="steps" aria-label="Urutan spin">
        <div class="step active"><span class="step-number">1</span><div class="step-slots"><i></i><i></i><i></i></div><small>KIRI</small></div>
        <b class="step-arrow" aria-hidden="true">›</b>
        <div class="step"><span class="step-number">2</span><div class="step-slots"><i></i><i></i><i></i></div><small>TENGAH</small></div>
        <b class="step-arrow" aria-hidden="true">›</b>
        <div class="step"><span class="step-number">3</span><div class="step-slots"><i></i><i></i><i></i></div><small>KANAN</small></div>
      </div>
      <div class="footer-aux"><span id="connection-status">Menghubungkan…</span><span>80% Color Match · Koin virtual</span></div>
    </footer>
  </main>
  <section id="celebration-overlay" class="celebration-overlay" aria-label="Celebration" role="dialog" aria-modal="true" hidden>
    <div class="celebration-particles" id="celebration-particles" aria-hidden="true"></div>
    <img id="celebration-art" class="celebration-art" src="/assets/art/v3/tier-5.webp" alt="Ilustrasi peringkat celebration" draggable="false">
    <div class="celebration-actual" role="status" aria-live="polite">
      <strong id="celebration-title">LUCKY COLOR WIN</strong>
      <span id="celebration-amount">Kembali 0 koin</span>
      <small id="celebration-preview" class="celebration-preview" hidden>DEMO VISUAL · TIDAK ADA HADIAH</small>
    </div>
    <button class="celebration-continue" id="celebration-continue" type="button">LANJUTKAN</button>
  </section>
  <dialog id="modal" class="modal" aria-label="Menu UNO LUCK">
    <div class="modal-card"><div class="modal-header"><h2 id="modal-title">UNO LUCK</h2><button id="modal-close" type="button" aria-label="Tutup">×</button></div><div class="modal-content" id="modal-content"></div></div>
  </dialog>
  <script src="/assets/art/motion.js?v=8" defer></script>
  <script src="/assets/art/ledwheel.js?v=1124" defer></script>
  <script src="/assets/art/sound.js?v=1117" defer></script>
  <script src="/assets/art/mirror-loop.js?v=1120" defer></script>
  <script src="/assets/art/sound-studio.js?v=1120" defer></script>
  <script src="/assets/art/match-announce.js?v=110" defer></script>
  <script src="/assets/art/celebrations.js?v=1116" defer></script>
  <script src="/assets/orbit.js?v=1124" defer></script>
  <script src="/assets/viewport-v11.js?v=1124" defer></script>
  <script src="/assets/boot.js?v=1124" defer></script>
</body>
</html>
