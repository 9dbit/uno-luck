<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0756db">
  <meta name="description" content="UNO LUCK Spin: Color Match tiga kartu, warna primer cerah, koin virtual gratis, tanpa nilai uang.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <link rel="manifest" href="/assets/spin-manifest.webmanifest">
  <link rel="icon" href="/assets/spin-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/spin.css?v=5">
  <title>UNO LUCK | Color Match Spin</title>
</head>
<body>
  <!-- Product boot: Soft Tech fades to black, then branded loading, then game. -->
  <div class="boot-overlay" id="boot-overlay" aria-label="Memulai UNO LUCK">
    <section class="boot-stage boot-softtech" id="boot-softtech" aria-label="Soft Tech">
      <img class="boot-softtech-logo" id="boot-softtech-img" src="/assets/boot-softtech.webp" alt="Soft Tech" decoding="async" fetchpriority="high">
    </section>
    <section class="boot-stage boot-banner" id="boot-banner" aria-label="Memuat UNO LUCK" hidden>
      <img id="boot-banner-img" class="boot-banner-img" src="/assets/boot-uno-banner.webp" alt="UNO LUCK: perempuan dan naga merah emas dengan kartu warna-warni" decoding="async">
      <div class="boot-banner-vignette" aria-hidden="true"></div>
      <div class="boot-loading-panel" id="boot-loading-panel">
        <p id="boot-loading-label" class="boot-loading-label">Menyiapkan permainan…</p>
        <div class="boot-loading-track" id="boot-loading-track" role="progressbar" aria-label="Persiapan permainan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="boot-loading-fill" class="boot-loading-fill"></div>
        </div>
        <strong id="boot-loading-percent" class="boot-loading-percent">0%</strong>
        <div class="boot-ready-actions" id="boot-ready-actions" hidden>
          <button type="button" class="boot-sound-start" id="boot-with-audio"><span aria-hidden="true">♫</span> MAIN DENGAN SUARA</button>
          <button type="button" class="boot-continue" id="boot-continue">LANJUT</button>
        </div>
      </div>
    </section>
  </div>
  <main class="game-shell is-booting" id="game-shell" aria-hidden="true">
    <div class="ambient-rays" aria-hidden="true"></div>
    <header class="hud" aria-label="Informasi permainan">
      <div class="level-wrap"><div class="level-star" aria-label="Level pemain"><span id="level-number">1</span></div><span class="micro-label">LEVEL</span></div>
      <button class="wallet" id="wallet-open" type="button" aria-label="Buka koin virtual">
        <span class="wallet-coin" aria-hidden="true">✦</span>
        <span class="wallet-content"><small>KOIN VIRTUAL</small><strong id="wallet-balance">1.000</strong></span>
        <span class="wallet-plus" aria-hidden="true">+</span>
      </button>
      <button class="menu-btn" id="menu-open" type="button" aria-label="Buka menu permainan"><span></span><span></span><span></span></button>
    </header>
    <section class="brand-zone" aria-label="UNO LUCK">
      <div class="brand-aura" aria-hidden="true"></div>
      <div class="brand-lockup">
        <span class="brand-wings wing-left" aria-hidden="true"><i></i><i></i><i></i></span>
        <div class="brand-words"><div class="brand-stars" aria-hidden="true">★ ★ ★</div><div class="brand-uno">UNO</div><div class="brand-luck">LUCK</div></div>
        <span class="brand-wings wing-right" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <span class="brand-subtitle">SPIN YOUR CARDS</span>
      <button type="button" class="profile-chip" id="profile-btn" aria-label="Profil pemain"><img src="/assets/spin-avatar.svg" alt="Avatar UNO LUCK"><strong id="profile-label">PLAYER</strong></button>
    </section>
    <section class="reel-area" aria-labelledby="match-title">
      <div class="top-caption"><span aria-hidden="true">✦</span><h1 id="match-title">COLOR MATCH!</h1><span aria-hidden="true">✦</span></div>
      <p class="win-conditions" id="win-conditions">3 WARNA SAMA <b>2×</b> KOIN PLACE</p>
      <div class="reel-stage" id="reel-stage">
        <div class="stage-sheen" aria-hidden="true"></div>
        <div class="card-reels" id="card-reels" role="group" aria-label="Tiga reel kartu, hasil diumumkan setelah berhenti">
          <div class="slot-window" data-reel="0"><div class="slot-track"><div class="metal-card card-back"><div class="card-inner"><span class="card-back-mark">UNO<small>LUCK</small></span></div></div></div></div>
          <div class="slot-window" data-reel="1"><div class="slot-track"><div class="metal-card card-back"><div class="card-inner"><span class="card-back-mark">UNO<small>LUCK</small></span></div></div></div></div>
          <div class="slot-window" data-reel="2"><div class="slot-track"><div class="metal-card card-back"><div class="card-inner"><span class="card-back-mark">UNO<small>LUCK</small></span></div></div></div></div>
        </div>
        <div class="win-burst" id="win-burst" aria-hidden="true"></div>
      </div>
      <div class="spin-summary" id="spin-summary" aria-live="polite">
        <div><span>Biaya</span><strong id="last-stake">25</strong></div>
        <div><span>Kembali</span><strong id="last-payout">—</strong></div>
        <div><span>Selisih</span><strong id="last-delta">—</strong></div>
      </div>
      <p class="spin-announcement" id="spin-announcement" role="status" aria-live="polite">Tekan PLACE untuk memutar tiga reel</p>
    </section>
    <section class="controls" aria-label="Kontrol permainan">
      <div class="main-actions">
        <button id="turbo-btn" type="button" class="round-action turbo" aria-pressed="false" aria-label="Turbo spin"><span class="round-icon">ϟ</span><small>TURBO</small></button>
        <div class="place-plinth"><button id="place-btn" class="place-button" type="button" aria-label="PLACE, mulai spin"><span>PLACE</span><small>TAP TO SPIN</small></button></div>
        <button id="auto-btn" type="button" class="round-action auto" aria-pressed="false" aria-label="Auto Spin, maksimal sepuluh putaran"><span class="round-icon">↻</span><small>AUTO</small></button>
      </div>
      <div class="stake-bar" aria-label="Pengaturan biaya PLACE">
        <span>BIAYA / PLACE</span>
        <div class="stake-controls"><button id="stake-minus" type="button" aria-label="Turunkan biaya PLACE">−</button><strong id="stake-value">✦ 25</strong><button id="stake-plus" type="button" aria-label="Naikkan biaya PLACE">+</button></div>
      </div>
      <div class="utility-row">
        <button id="gift-btn" type="button" aria-label="Klaim hadiah harian"><span aria-hidden="true">🎁</span><small>HADIAH</small></button>
        <button id="history-btn" type="button" aria-label="Lihat riwayat spin"><span aria-hidden="true">▤</span><small>RIWAYAT</small></button>
        <button id="music-btn" type="button" aria-label="Nyalakan atau matikan musik" aria-pressed="true"><span aria-hidden="true">♫</span><small>MUSIK</small></button>
        <button id="sfx-btn" type="button" aria-label="Nyalakan atau matikan efek suara" aria-pressed="true"><span aria-hidden="true">◖))</span><small>EFEK</small></button>
      </div>
    </section>
    <div class="notice-line"><span class="dot"></span><span id="connection-status">Menghubungkan…</span><span>·</span><span>Koin demo, bukan uang</span></div>
  </main>
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <dialog class="modal" id="modal"><div class="modal-card"><div class="modal-heading"><h2 id="modal-title">UNO LUCK</h2><button id="modal-close" type="button" class="modal-x" aria-label="Tutup">×</button></div><div id="modal-content" class="modal-content"></div></div></dialog>
  <script src="/assets/spin.js?v=1145" defer></script>
  <script src="/assets/boot.js?v=5" defer></script>
</body>
</html>
