name: CP16 Live Signed Wallet Pilot Acceptance
on:
  push:
    branches: [verify/cp16-live-wallet-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect actual deployed admin and isolated UNO staging pilot
        run: python tests/cp16_live_wallet_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp16-staging-wallet-live-probe
          path: cp16-live-evidence/
          retention-days: 14
