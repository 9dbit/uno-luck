name: CP16 Source Assembly Verification
on:
  push:
    branches: [feat/cp16-source-wallet-20261103]
    paths: ['.github/workflows/cp16-assemble.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cp16-source-wallet-20261103
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Decode hash-verified patch and apply runtime files only
        run: |
          python - <<'PY'
          import base64,hashlib,pathlib,subprocess,zlib
          base='5c060f8562aa98554f9fb064710042f07c658b40'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          encoded=''.join(pathlib.Path(f'.cp16-transfer/{i:02d}.b64').read_text().strip() for i in range(1,7))
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='b16c60aba0df52186ca47871fc770aab38c64829755377040182fa9b67ae453e'
          allowed={'.github/workflows/cp16-wallet.yml','app/main.py','app/spin.py','app/source_wallet.py','tests/test_source_wallet.py','sources/CP16_SOURCE_WALLET.md'}
          changed={line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert changed==allowed,(changed,allowed)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','-'],input=patch,check=True)
          subprocess.run(['git','diff','--exit-code',base,'--','app/engine.py','app/orbit.py','app/static'],check=True)
          for p in pathlib.Path('.cp16-transfer').glob('*.b64'):p.unlink()
          pathlib.Path('.cp16-source.patch.zlib.b64').unlink(missing_ok=True)
          PY
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - name: Commit tested runtime source without transfer data
        run: |
          git config user.name '9dbit'
          git config user.email '154832153+9dbit@users.noreply.github.com'
          git add app tests sources .cp16-transfer .cp16-source.patch.zlib.b64
          git commit -m 'feat(cp16): authoritative staged source balance ledger and idempotent signed commands'
          git push origin HEAD:feat/cp16-source-wallet-20261103
          git rev-parse HEAD
