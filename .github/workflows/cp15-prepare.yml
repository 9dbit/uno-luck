name: CP15 Frozen Runtime Source Preparation
on:
  push:
    branches: [feat/cp15-uno-outbox-20261103]
    paths: [tools/apply-cp15.py, .github/workflows/cp15-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hash-verified source delta
        run: python tools/apply-cp15.py
      - name: Install frozen runtime and test dependencies
        run: pip install -r requirements.txt pytest==9.0.2 httpx==0.28.1 Pillow
      - name: Run original server rules and outbox regression
        run: |
          python -m compileall -q app
          python -m pytest -q tests/test_engine.py tests/test_orbit.py tests/test_spin.py tests/test_uno_combo_patterns.py tests/test_gameops_outbox.py | tee cp15-source-tests.log
      - name: Publish only verified source to this feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: feat/cp15-uno-outbox-20261103
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git add app/main.py app/spin.py app/orbit.py app/round_outbox.py deploy/start-web.sh tests/test_gameops_outbox.py sources/CP15_ROUND_OUTBOX.md
          git rm tools/apply-cp15.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cp15): persist signed staging round observations in an atomic outbox'
          git push origin HEAD:refs/heads/$BRANCH
          git rev-parse HEAD > cp15-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp15-uno-source-tests
          path: |
            cp15-source-tests.log
            cp15-source-sha.txt
          retention-days: 14
