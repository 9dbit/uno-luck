name: Test UNO LUCK Spin
on:
  push:
    branches: [main, 'fix/uno-v13-solid-uno-led-emissive-20261019']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: node --check app/static/boot.js
      - run: node --check app/static/viewport-v11.js
      - run: node --check app/static/orbit.js
      - run: node --check app/static/admin.js
      - run: node --check app/static/pwa-update.js
      - run: node --check app/static/art/motion.js
      - run: node --check app/static/art/ledwheel.js
      - run: node --check app/static/art/sound.js
      - run: node --check app/static/art/sound-studio.js
      - run: node --check app/static/art/mirror-loop.js
      - run: node tests/test_mirror_loop.cjs
      - run: node --check app/static/art/celebrations.js
      - run: node --check app/static/art/match-announce.js

  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx playwright
      - run: python -m playwright install --with-deps chromium webkit
      - name: Verify game and Sound Studio in Chromium
        run: |
          export UNO_SOUND_STORAGE_DIR="/tmp/uno-sound-ci-${GITHUB_RUN_ID}"
          export UNO_SOUND_ADMIN_TOKEN="uno-ci-only-shared-sound-secret-for-playwright-2026"
          python tests/seed_ci_published_sounds.py
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/uno-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          python -m py_compile tests/visual_qa_shared_sound.py tests/visual_qa_smooth_hud_splash.py tests/visual_qa_iphone15pro_fullbleed.py
          python tests/visual_qa_led_chase.py
          python tests/visual_qa_player_admin.py
          python tests/visual_qa_player_panels.py
          python tests/visual_qa_pwa_recovery.py
          python tests/visual_qa_solid_led.py
          python tests/visual_qa_smooth_hud_splash.py
          python tests/visual_qa_iphone15pro_fullbleed.py
          UNO_QA_ENGINE=chromium python tests/visual_qa_iphone15pro_fullbleed.py
          python tests/visual_qa_sound_studio.py
          python tests/visual_qa_jackpot_sfx.py
          python tests/visual_qa_ios_safari_audio.py
          python tests/visual_qa_gameplay_music.py
          python tests/visual_qa_shared_sound.py
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uno-v11-sound-studio-responsive
          path: |
            artifacts/uno-v13-solid-led/*
            artifacts/uno-v1143-player-admin/*
            artifacts/uno-v1146-player-panels/*
            artifacts/uno-v1144-pwa-recovery/*
            artifacts/uno-v11-led-chase/*.png
            artifacts/uno-v11-gameplay-music/*.png
            artifacts/uno-v12-iphone15pro-fullbleed/*.png
            artifacts/uno-v11-sound-studio/*.png
            artifacts/uno-v11-jackpot-audio/*.png
            artifacts/uno-v11-ios-safari-audio/*.png
            artifacts/uno-v11-shared-sound/*.png
          if-no-files-found: ignore

  volume-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate mounted volume is writable by application user
        run: |
          docker build -t uno-volume-runtime .
          mkdir -p "$RUNNER_TEMP/uno-sound-test"
          chmod 0700 "$RUNNER_TEMP/uno-sound-test"
          docker run -d --name uno-volume-test -p 127.0.0.1:18085:8080 -v "$RUNNER_TEMP/uno-sound-test:/data/uno-luck-audio" -e UNO_SOUND_STORAGE_DIR=/data/uno-luck-audio uno-volume-runtime
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18085/api/sounds/health > /tmp/uno-sound-probe.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; a=json.load(open("/tmp/uno-sound-probe.json")); assert a["ready"] and a["published_cues"]==0'
          test "$(docker exec uno-volume-test stat -c %u /data/uno-luck-audio)" = 10001
          echo "PASS: Railway style volume is writable as UID 10001"
