name: Test UNO LUCK Spin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: node --check app/static/orbit.js
      - run: node --check app/static/art/motion.js
      - run: node --check app/static/art/ledwheel.js
