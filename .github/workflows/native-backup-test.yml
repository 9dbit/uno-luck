name: Native engine backup tests
on:
  push:
    branches: [feat/softtech-provider-v1-20261109]
    paths: ['scripts/native_backup*.py', 'tests/test_native_backup*.py', app/provider_main.py, Dockerfile.provider, requirements.txt, .github/workflows/native-backup-test.yml]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'boto3==1.43.118' 'cryptography>=44,<48'
      - run: python -m unittest discover -s tests -p 'test_native_backup*.py' -v
